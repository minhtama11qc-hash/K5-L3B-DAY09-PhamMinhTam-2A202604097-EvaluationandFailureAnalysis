# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket_trust: ticket number overrides the DB fact
stale_policy: FM-06            # stale_clause: superseded or not-yet-effective clause applied
clause_sum: FM-04              # sum_parts: clauses added instead of taking the max
double_deduct: FM-05           # pre_deducted: prior refund subtracted by agent and host
sibling_refund: FM-07          # sibling_refund: money booked under another claim of the order
denied_ignored: FM-02          # ignore_denied: host said no, agent says resolved
reply_ledger_mismatch: FM-08   # misreport: reply amount != ledger amount
cross_principal: FM-09         # cross_principal: acting on another principal's order or data
